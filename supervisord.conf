;
; Both programs inherit the ORBIT_* environment start.sh exported. The CLI
; commands that need the SQLite database to themselves (root, recovery-link,
; setup-token, backup restore) run through bin/orbit-offline, which stops and
; restarts the orbit program here.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisor/supervisord.pid
user=root

[unix_http_server]
file=/run/supervisor/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor/supervisor.sock

; Orbit drains for up to 30 seconds after SIGTERM.
[program:orbit]
command=/app/code/libexec/orbit serve
directory=/app/data
user=cloudron
environment=HOME="/app/data"
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopwaitsecs=40
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -c /run/orbit/nginx.conf -g "daemon off;"
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

name: Cloudron Catalog Publication

# Managed opt-in caller. Keep publication disabled until checks, GHCR visibility
# and branch policy are reviewed. The job token publishes; the optional
# CLOUDRON_RELEASE_PAT is needed only if main requires PRs or status checks.
# PRs only run the checks and build the image without pushing it.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudron-catalog-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  catalog:
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    uses: marcusquinn/aidevops/.github/workflows/cloudron-catalog-publish-reusable.yml@6dfe5be70118a8a8d4549dc9a4f76f9be5dd2e97
    with:
      aidevops_ref: 6dfe5be70118a8a8d4549dc9a4f76f9be5dd2e97
      image_repository: ghcr.io/marcusquinn/cloudron-orbit-app
      package_checks: |
        bash test/package-test.sh
        shellcheck start.sh lib/orbit-env.sh bin/orbit bin/orbit-offline bin/orbit-setup-link bin/orbit-mail-settings test/package-test.sh
    secrets:
      CLOUDRON_RELEASE_PAT: ${{ secrets.CLOUDRON_RELEASE_PAT }}
